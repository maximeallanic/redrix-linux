<text x="20" y="60" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368">Hardware support at a glance. One machine tested: Debian testing, GNOME 51, kernel 7.2, MrChromebox UEFI 2609.1</text>
