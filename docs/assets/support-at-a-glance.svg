<title id="t">HP Elite Dragonfly Chromebook (redrix) under Linux: hardware support at a glance</title>
<desc id="d">12 items work out of the box, 6 work with this kit or a documented setup step, 6 are partial, 2 do not work and 2 are untested. Source: docs/hardware-support.md.</desc>
