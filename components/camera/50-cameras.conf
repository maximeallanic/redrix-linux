# Camera device policy for the Redrix (IPU6 + hi556 internal sensor).
#
# The IPU6 ISYS exposes 32 raw capture nodes that only produce Bayer data;
# the internal camera is usable through libcamera (simple pipeline), so the
# raw V4L2 devices are hidden. A USB webcam, when plugged in, outranks the
# internal camera as the default video source (hi556 via libcamera = 700).

monitor.v4l2.rules = [
  {
    matches = [
      { device.product.name = "ipu6" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "~v4l2_input\\..*-usb-.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1000
      }
    }
  }
]
