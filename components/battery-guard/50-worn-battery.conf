# redrix-linux (battery-guard): earlier low-battery thresholds for a worn battery. An aged cell's charge estimate
# drops abruptly at the end (one test machine at ~80 % health cut out at 2 %), so UPower powers off cleanly at 6 %
# instead. Power-off rather than suspend: a suspended session is lost anyway if the battery dies, and hibernation
# needs a disk swap most installs lack. See docs/components/battery-guard.md.
[UPower]
PercentageLow=20.0
PercentageCritical=10.0
PercentageAction=6.0
CriticalPowerAction=PowerOff
