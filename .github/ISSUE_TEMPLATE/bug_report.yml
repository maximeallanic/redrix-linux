name: Bug report
description: A component does not install, uninstall or work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before posting, remove anything personal from the outputs (user name, host name, serial numbers).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [haptics, pen, top-row, camera, microphone, speakers, suspend, battery-guard, keychron, fingerprint, fingerprint-login, lockscreen-fingerprint, boot-splash, shutdown-splash, installer or uninstaller]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kit version
      description: Output of `./install.sh --version` (or the commit)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution (PRETTY_NAME in /etc/os-release), `gnome-shell --version`, `uname -r`, firmware version (`cat /sys/class/dmi/id/bios_version`)
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: Output of ./verify.sh <component>
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of the failing command
      render: shell
